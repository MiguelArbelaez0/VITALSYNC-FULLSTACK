# Temporary services in the SAME project; only the separate test database is used.
services:
  test-backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vitalsync}:${POSTGRES_PASSWORD:-local_demo_change_me}@db:5432/${VITALSYNC_TEST_DATABASE_NAME:-vitalsync_test}
      VITALSYNC_TEST_DATABASE_NAME: ${VITALSYNC_TEST_DATABASE_NAME:-vitalsync_test}
      DEMO_MODE: "true"
      DOCTOR_CREDENTIAL_KEY: ${DOCTOR_CREDENTIAL_KEY:-}
      COOKIE_SECURE: "false"
      ALLOWED_ORIGINS: http://localhost:5289
    ports: ["127.0.0.1:8189:8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 30
  test-frontend:
    build: ./frontend
    ports: ["127.0.0.1:5289:80"]
    volumes: ["./infrastructure/nginx.test.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on:
      test-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 3s
      timeout: 3s
      retries: 15
