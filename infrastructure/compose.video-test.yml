# Isolated real-media test services, sharing the existing Compose network and PostgreSQL server.
services:
  test-backend:
    environment:
      LIVEKIT_ENABLED: "true"
      LIVEKIT_API_URL: http://test-livekit:7880
      LIVEKIT_PUBLIC_URL: ws://localhost:7888
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_TOKEN_TTL_SECONDS: "600"
      TELECONSULT_ROOM_OPEN_MINUTES: "525600"
  test-livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    environment:
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        keys:
          "${LIVEKIT_API_KEY:-}": "${LIVEKIT_API_SECRET:-}"
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 50100
        webhook:
          api_key: "${LIVEKIT_API_KEY:-}"
          urls:
            - "http://test-backend:8000/api/livekit/webhook"
    command: ["--bind", "0.0.0.0"]
    ports:
      - "127.0.0.1:7888:7880/tcp"
      - "127.0.0.1:7889:7881/tcp"
      - "127.0.0.1:50150-50250:50000-50100/udp"
