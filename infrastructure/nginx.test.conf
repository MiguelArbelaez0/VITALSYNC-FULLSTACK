server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data:; connect-src 'self' ws: wss: https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    resolver 127.0.0.11 valid=1s ipv6=off;
    location /api/ {
        set $api_upstream test-backend:8000;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
    }
    location / { try_files $uri $uri/ /index.html; }
}
