name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: vitalsync
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: vitalsync_test_audit_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vitalsync -d vitalsync_test_audit_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql+psycopg://vitalsync:ci-only-not-a-secret@localhost:5432/vitalsync_test_audit_ci
      VITALSYNC_TEST_DATABASE_NAME: vitalsync_test_audit_ci
      DEMO_MODE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.lock
      - name: Run backend suite against isolated PostgreSQL
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build React application
        working-directory: frontend
        run: npm run build
