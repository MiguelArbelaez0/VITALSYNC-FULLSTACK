name: vitalsync
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vitalsync}
      POSTGRES_USER: ${POSTGRES_USER:-vitalsync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_demo_change_me}
    ports:
      - "127.0.0.1:${VITALSYNC_POSTGRES_PORT:-5488}:5432"
    volumes:
      - vitalsync_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 25
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vitalsync}:${POSTGRES_PASSWORD:-local_demo_change_me}@postgres:5432/${POSTGRES_DB:-vitalsync}
      DEMO_MODE: ${DEMO_MODE:-true}
      HOLD_MINUTES: ${HOLD_MINUTES:-10}
      CANCELLATION_HOURS: ${CANCELLATION_HOURS:-2}
      SESSION_HOURS: ${SESSION_HOURS:-12}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: http://localhost:${VITALSYNC_FRONTEND_PORT:-5188},http://127.0.0.1:${VITALSYNC_FRONTEND_PORT:-5188},http://localhost:${VITALSYNC_BACKEND_PORT:-8088}
    ports:
      - "127.0.0.1:${VITALSYNC_BACKEND_PORT:-8088}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 25
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:${VITALSYNC_FRONTEND_PORT:-5188}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  vitalsync_data:
